<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AliKit has moved — Alicorn components</title>
    <script>
      // Preserve catalog deep links: /alicorn-kit/components/radio-group/ ->
      // /alicorn-website/components/radio-group/. Reference pages moved under /docs/reference/.
      (function () {
        var target = 'https://carnival-science.github.io/alicorn-website/components/';
        var path = window.location.pathname.replace(/^\/alicorn-kit\/?/, '');
        if (path.indexOf('components/') === 0) {
          target = 'https://carnival-science.github.io/alicorn-website/' + path;
        } else if (path.indexOf('manifest') === 0) {
          target = 'https://carnival-science.github.io/alicorn-website/docs/reference/manifest/';
        } else if (path.indexOf('compatibility') === 0) {
          target = 'https://carnival-science.github.io/alicorn-website/docs/reference/compatibility/';
        }
        window.location.replace(target + window.location.hash);
      })();
    </script>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1eee5;
        color: #252b2e;
        font: 1rem/1.6 "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; letter-spacing: -0.03em; }
      a { color: #22627f; }
    </style>
  </head>
  <body>
    <main>
      <h1>AliKit now lives with Alicorn.</h1>
      <p>
        This page moved to the consolidated Alicorn documentation site.
        <a href="https://carnival-science.github.io/alicorn-website/components/">Continue to the component catalog</a>.
      </p>
    </main>
  </body>
</html>
