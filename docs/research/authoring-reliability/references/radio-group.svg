<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Radio Group visual reference</title>
  <desc id="desc">A document editor preference page with a single-choice density group, selected and focused option, and a disabled choice.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ink{fill:#263344}.muted{fill:#617287}.quiet{fill:#8795a3}.line{stroke:#d7dfe6}
  </style>
  <rect width="1280" height="800" fill="#eef2f3"/><rect width="1280" height="60" fill="#f8faf9"/><rect x="28" y="14" width="32" height="32" rx="10" fill="#567f73"/><path d="M37 22h14v16H37zM40 26h8M40 30h8M40 34h5" fill="none" stroke="#f4fbf6" stroke-width="1.5"/><text x="74" y="38" class="ink" font-size="15" font-weight="700">MARGIN</text><text x="174" y="38" class="muted" font-size="12">Preferences</text><circle cx="1208" cy="30" r="15" fill="#dbe6e1"/><text x="1208" y="35" class="ink" font-size="11" font-weight="700" text-anchor="middle">K</text>
  <rect x="0" y="60" width="252" height="740" fill="#e5ebea"/><text x="30" y="105" class="quiet" font-size="10" font-weight="700" letter-spacing="1.4">WRITING</text><rect x="16" y="121" width="220" height="38" rx="8" fill="#d1e1da"/><text x="34" y="146" fill="#345c4d" font-size="13" font-weight="650">Reading layout</text><text x="34" y="193" class="muted" font-size="13">Typography</text><text x="34" y="235" class="muted" font-size="13">Proofing</text><text x="30" y="299" class="quiet" font-size="10" font-weight="700" letter-spacing="1.4">WORKSPACE</text><text x="34" y="338" class="muted" font-size="13">Appearance</text><text x="34" y="380" class="muted" font-size="13">Shortcuts</text>
  <text x="304" y="120" class="quiet" font-size="11" letter-spacing="1.5">WRITING / READING LAYOUT</text><text x="304" y="166" class="ink" font-size="28" font-weight="650">Reading layout</text><text x="304" y="196" class="muted" font-size="14">Choose the amount of space around your notes.</text>
  <rect x="304" y="226" width="904" height="440" rx="14" fill="#fbfcfb" stroke="#d7dfdf"/><text x="340" y="273" class="ink" font-size="16" font-weight="650">Page density</text><text x="340" y="299" class="muted" font-size="12">This setting applies to new and existing documents.</text>
  <rect x="340" y="329" width="832" height="78" rx="11" fill="#f6f8f7" stroke="#d9e0e1"/><circle cx="372" cy="368" r="10" fill="#fbfcfb" stroke="#8b9aa4" stroke-width="1.5"/><text x="400" y="363" class="ink" font-size="13" font-weight="600">Compact</text><text x="400" y="385" class="muted" font-size="11">More lines on screen, tighter spacing.</text><rect x="1080" y="347" width="58" height="42" rx="6" fill="#e5ebe9"/><path d="M1091 358h36M1091 368h36M1091 378h36" stroke="#82928e" stroke-width="2"/>
  <rect x="340" y="419" width="832" height="78" rx="11" fill="#edf5f1" stroke="#598b76" stroke-width="1.5"/><circle cx="372" cy="458" r="10" fill="#fff" stroke="#4d846d" stroke-width="1.5"/><circle cx="372" cy="458" r="5" fill="#4d846d"/><text x="400" y="453" class="ink" font-size="13" font-weight="650">Comfortable</text><text x="400" y="475" class="muted" font-size="11">Balanced line length and breathing room.</text><rect x="1080" y="437" width="58" height="42" rx="6" fill="#d7e6de"/><path d="M1091 448h36M1091 458h36M1091 468h36" stroke="#628574" stroke-width="2"/>
  <rect x="340" y="509" width="832" height="78" rx="11" fill="#f6f8f7" stroke="#d9e0e1"/><circle cx="372" cy="548" r="10" fill="#fbfcfb" stroke="#8b9aa4" stroke-width="1.5"/><text x="400" y="543" class="ink" font-size="13" font-weight="600">Spacious</text><text x="400" y="565" class="muted" font-size="11">Larger margins for focused reading.</text><rect x="1080" y="527" width="58" height="42" rx="6" fill="#e5ebe9"/><path d="M1096 542h26M1096 552h26" stroke="#82928e" stroke-width="2"/>
  <rect x="340" y="599" width="832" height="42" rx="9" fill="#f0f2f2"/><circle cx="372" cy="620" r="8" fill="#f0f2f2" stroke="#b6c0c5" stroke-width="1.5"/><text x="400" y="624" fill="#9aa4aa" font-size="12">Follow the system (unavailable on this device)</text>
  <rect x="340" y="414" width="832" height="88" rx="14" fill="none" stroke="#3e78bc" stroke-width="2.5" opacity=".8"/><text x="340" y="704" class="quiet" font-size="11">SELECTED STATE AND KEYBOARD FOCUS USE DISTINCT CUES</text><rect x="1062" y="710" width="110" height="40" rx="9" fill="#4d806d"/><text x="1092" y="735" fill="#fff" font-size="12" font-weight="650">Save</text><text x="1232" y="776" class="quiet" font-size="11" text-anchor="end">AUTHORED TARGET · NOT A CAPTURE</text>
</svg>
