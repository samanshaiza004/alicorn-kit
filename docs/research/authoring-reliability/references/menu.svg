<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Menu visual reference</title>
  <desc id="desc">A compact anchored actions menu with a checked item, keyboard shortcuts, separator, and disabled action.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.ink{fill:#e9edf3}.muted{fill:#9ba7b7}.quiet{fill:#718094}.line{stroke:#303a49}
  </style>
  <rect width="1280" height="800" fill="#111722"/><rect width="1280" height="62" fill="#171f2b"/>
