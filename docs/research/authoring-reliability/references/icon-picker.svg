<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Icon Picker — List appearance visual target</title>
  <desc id="desc">An authored visual reference for the AliKit Icon Picker in a dimmed workspace dialog. The search field is focused, and each list row horizontally aligns its icon, name, and detail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18202b"/>
      <stop offset="1" stop-color="#10151d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252e3b"/>
      <stop offset="1" stop-color="#202835"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05080d" flood-opacity=".48"/>
    </filter>
  </defs>

  <!-- Application frame and subdued workspace behind the modal. -->
  <rect width="800" height="600" rx="20" fill="#0b0f14"/>
  <rect x="1" y="1" width="798" height="598" rx="19" fill="url(#bg)" stroke="#3b4655" stroke-width="2"/>
  <path d="M2 20a18 18 0 0 1 18-18h760a18 18 0 0 1 18 18v38H2z" fill="#222a35"/>
  <circle cx="25" cy="30" r="6" fill="#f1766d"/>
  <circle cx="47" cy="30" r="6" fill="#e9bd62"/>
  <circle cx="69" cy="30" r="6" fill="#72c78a"/>
  <text x="96" y="36" fill="#c5cfdd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Icon Picker</text>
  <text x="52" y="112" fill="#e3eaf4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="650">Workspace</text>
  <text x="52" y="143" fill="#8995a6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Choose a symbol to use in your document.</text>
  <rect x="52" y="171" width="144" height="39" rx="9" fill="#547fc5"/>
  <text x="124" y="196" text-anchor="middle" fill="#f6f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Insert icon</text>
  <rect x="207" y="171" width="178" height="39" rx="9" fill="#293241" stroke="#414d5e"/>
  <text x="296" y="196" text-anchor="middle" fill="#c4cedc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Appearance · List</text>
  <rect x="52" y="240" width="696" height="286" rx="12" fill="#151c26" stroke="#263140"/>
  <text x="76" y="277" fill="#b8c3d2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">RECENTLY USED</text>
  <rect x="76" y="296" width="180" height="48" rx="9" fill="#222c39"/>
  <circle cx="100" cy="320" r="11" fill="#3f6da9"/>
  <path d="M94 320h12M100 314v12" stroke="#e4edfa" stroke-width="1.8" stroke-linecap="round"/>
  <text x="120" y="325" fill="#d9e1ec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Workspace</text>
  <rect width="800" height="600" rx="20" fill="#070a0f" fill-opacity=".69"/>

  <!-- Visual target is a designed reference, not a captured application frame. -->
  <g filter="url(#shadow)">
    <rect x="131" y="112" width="538" height="376" rx="16" fill="url(#panel)" stroke="#435064" stroke-width="1.2"/>
    <text x="157" y="151" fill="#eef3fa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Choose an icon</text>
    <rect x="589" y="128" width="54" height="29" rx="7" fill="#2d3745" stroke="#465264"/>
    <path d="m610 138 10 10m0-10-10 10" stroke="#b5c0ce" stroke-width="1.7" stroke-linecap="round"/>

    <rect x="157" y="169" width="486" height="42" rx="9" fill="#171e28" stroke="#86b3f4" stroke-width="1.5"/>
    <circle cx="177" cy="189" r="6.5" fill="none" stroke="#98a8bd" stroke-width="1.6"/>
    <path d="m182 194 4 4" stroke="#98a8bd" stroke-width="1.6" stroke-linecap="round"/>
    <text x="198" y="194" fill="#a5b1c1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Search icons</text>
    <path d="M198 180v19" stroke="#83adf0" stroke-width="1.4"/>

    <!-- First row is selected; icon, label, and detail share one centered baseline. -->
    <rect x="157" y="222" width="486" height="38" rx="7" fill="#344d70" stroke="#6f9de0"/>
    <rect x="167" y="230" width="22" height="22" rx="6" fill="#537fbe"/>
    <path d="M171 240 178 234l7 6v7h-5v-5h-4v5h-5z" fill="none" stroke="#f1f6fd" stroke-width="1.35" stroke-linejoin="round"/>
    <text x="201" y="245" fill="#f2f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Home</text>
    <text x="269" y="245" fill="#c3d0e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Go to the workspace home</text>
    <circle cx="621" cy="241" r="3.5" fill="#a8cbff"/>

    <rect x="157" y="266" width="486" height="38" rx="7" fill="#252f3d" stroke="#3d495a"/>
    <rect x="167" y="274" width="22" height="22" rx="6" fill="#303c4c"/>
    <circle cx="177" cy="283" r="5.2" fill="none" stroke="#d5deea" stroke-width="1.4"/>
    <path d="m181 287 4 4" stroke="#d5deea" stroke-width="1.4" stroke-linecap="round"/>
    <text x="201" y="289" fill="#e0e7f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Search</text>
    <text x="269" y="289" fill="#9daabc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Search files and commands</text>

    <rect x="157" y="310" width="486" height="38" rx="7" fill="#252f3d" stroke="#3d495a"/>
    <rect x="167" y="318" width="22" height="22" rx="6" fill="#303c4c"/>
    <circle cx="178" cy="329" r="6" fill="none" stroke="#d5deea" stroke-width="1.3"/>
    <path d="M178 325v4l3 2" fill="none" stroke="#d5deea" stroke-width="1.3" stroke-linecap="round"/>
    <text x="201" y="333" fill="#e0e7f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Settings</text>
    <text x="269" y="333" fill="#9daabc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Open application settings</text>

    <rect x="157" y="354" width="486" height="38" rx="7" fill="#252f3d" stroke="#3d495a"/>
    <rect x="167" y="362" width="22" height="22" rx="6" fill="#303c4c"/>
    <path d="m172 373 4 4 8-9" fill="none" stroke="#d5deea" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="201" y="377" fill="#e0e7f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Save</text>
    <text x="269" y="377" fill="#9daabc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Save the current document</text>

    <rect x="157" y="398" width="486" height="38" rx="7" fill="#252f3d" stroke="#3d495a"/>
    <rect x="167" y="406" width="22" height="22" rx="6" fill="#303c4c"/>
    <path d="m178 409 7 13h-14z" fill="none" stroke="#d5deea" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="178" cy="418" r=".9" fill="#d5deea"/>
    <text x="201" y="421" fill="#e0e7f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Warning</text>
    <text x="269" y="421" fill="#9daabc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Show a warning marker</text>

    <rect x="157" y="450" width="135" height="25" rx="7" fill="#2b3543" stroke="#465264"/>
    <text x="224.5" y="467" text-anchor="middle" fill="#c9d3e0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="550">Shortcut details</text>
  </g>
  <text x="400" y="570" text-anchor="middle" fill="#8793a2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650" letter-spacing="1.5">VISUAL REFERENCE · NOT A CAPTURE</text>
</svg>
