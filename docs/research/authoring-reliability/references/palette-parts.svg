<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Palette Parts visual reference</title>
  <desc id="desc">A custom command overlay over a source-control workspace, with an app-owned query and a parts-based result list.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.ink{fill:#e8edf6}.muted{fill:#9caabd}.quiet{fill:#75839a}.rule{stroke:#303b4a}
  </style>
  <rect width="1280" height="800" fill="#111722"/><rect width="1280" height="58" fill="#19212d"/><rect x="24" y="14" width="30" height="30" rx="8" fill="#8b78d8"/><path d="M32 22h14v14H32zM36 26h6" fill="none" stroke="#f5f2ff" stroke-width="1.5"/><text x="68" y="37" class="ink" font-size="15" font-weight="650">ALDER</text><text x="160" y="37" class="muted" font-size="12">source control</text><text x="1050" y="37" class="quiet" font-size="12">main ⌄</text>
  <rect x="0" y="58" width="230" height="742" fill="#171e29"/><text x="28" y="105" class="quiet" font-size="10" font-weight="700" letter-spacing="1.5">REPOSITORY</text><text x="28" y="146" class="ink" font-size="13">⌂  Overview</text><rect x="14" y="164" width="202" height="36" rx="7" fill="#2a2b43"/><rect x="26" y="175" width="14" height="14" rx="3" fill="#a18ce8"/><text x="52" y="188" class="ink" font-size="13">⌘  Changes</text><text x="28" y="237" class="muted" font-size="13">⑂  Branches</text><text x="28" y="277" class="muted" font-size="13">◷  History</text><line x1="24" y1="305" x2="204" y2="305" class="rule"/><text x="28" y="339" class="quiet" font-size="10" font-weight="700" letter-spacing="1.4">WORKTREES</text><text x="28" y="378" class="muted" font-size="12">● release/1.4</text><text x="28" y="410" class="muted" font-size="12">● fix/search-focus</text>
  <text x="270" y="108" class="ink" font-size="24" font-weight="650">Changes</text><text x="270" y="136" class="muted" font-size="13">Review and prepare the next commit.</text><rect x="270" y="170" width="920" height="62" rx="9" fill="#1b2430" stroke="#303b4a"/><text x="294" y="207" class="muted" font-size="13">3 files changed</text><text x="1120" y="207" class="quiet mono" font-size="12" text-anchor="end">+84  −12</text><rect x="270" y="252" width="920" height="62" rx="9" fill="#1b2430"/><text x="294" y="289" class="ink mono" font-size="13">runtime/input.odin</text><text x="1148" y="289" fill="#7fc89c" class="mono" font-size="12">M</text><rect x="270" y="330" width="920" height="62" rx="9" fill="#1b2430"/><text x="294" y="367" class="ink mono" font-size="13">runtime/focus.odin</text><text x="1148" y="367" fill="#7fc89c" class="mono" font-size="12">M</text>
  <rect width="1280" height="800" fill="#070b10" opacity=".72"/><rect x="332" y="116" width="616" height="568" rx="16" fill="#202936" stroke="#414c5d" filter="drop-shadow(0 18px 36px #0009)"/>
  <text x="370" y="160" class="ink" font-size="20" font-weight="650">Go to</text><text x="370" y="184" class="muted" font-size="12">Quick actions for this repository</text><rect x="370" y="208" width="540" height="52" rx="9" fill="#141a23" stroke="#8476d0" stroke-width="1.5"/><circle cx="392" cy="231" r="6" fill="none" stroke="#9caabd" stroke-width="1.5"/><line x1="396" y1="236" x2="401" y2="241" stroke="#9caabd" stroke-width="1.5"/><text x="416" y="236" class="ink" font-size="14">branch</text><rect x="456" y="218" width="54" height="30" rx="5" fill="#3c3657"/><text x="466" y="238" fill="#d6caff" font-size="13" font-weight="650">branch</text>
  <rect x="370" y="276" width="540" height="75" rx="9" fill="#32354a" stroke="#685fa5"/><rect x="388" y="295" width="38" height="38" rx="10" fill="#49456a"/><path d="M399 306v16m0-10h14m-5-5l5 5-5 5" fill="none" stroke="#d6ccff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="444" y="306" class="ink" font-size="13" font-weight="650">Switch branch</text><text x="444" y="330" class="muted" font-size="11">Choose a local branch for this worktree</text><rect x="822" y="302" width="68" height="24" rx="5" fill="#292c3e"/><text x="836" y="318" class="muted mono" font-size="10">⌘ B</text>
  <rect x="370" y="359" width="540" height="65" rx="9" fill="transparent"/><rect x="388" y="373" width="38" height="38" rx="10" fill="#292f3b"/><path d="M398 381h18v14h-18zM402 398h10" fill="none" stroke="#b2bdd0" stroke-width="1.4"/><text x="444" y="387" class="ink" font-size="13" font-weight="600">Create branch</text><text x="444" y="408" class="muted" font-size="11">Start from the current commit</text>
  <rect x="370" y="429" width="540" height="65" rx="9" fill="transparent"/><rect x="388" y="443" width="38" height="38" rx="10" fill="#292f3b"/><path d="M399 455h16m-16 6h11m-11 6h14" stroke="#b2bdd0" stroke-width="1.4" stroke-linecap="round"/><text x="444" y="457" class="ink" font-size="13" font-weight="600">Open recent worktree</text><text x="444" y="478" class="muted" font-size="11">Return to another task</text>
  <line x1="370" y1="520" x2="910" y2="520" class="rule"/><text x="372" y="552" class="muted" font-size="11">3 actions</text><text x="484" y="552" class="quiet" font-size="11">↑ ↓ navigate</text><text x="616" y="552" class="quiet" font-size="11">↵ open</text><text x="718" y="552" class="quiet" font-size="11">Esc close</text><text x="24" y="776" class="quiet" font-size="11" letter-spacing="1.4">CUSTOM SHELL · PUBLIC RESULT PARTS</text><text x="1252" y="776" class="quiet" font-size="11" text-anchor="end">AUTHORED TARGET · NOT A CAPTURE</text>
</svg>
