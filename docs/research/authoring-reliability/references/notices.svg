<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Notices visual reference</title>
  <desc id="desc">An audio render queue showing an inline warning card and stacked save and export notices with actions.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.ink{fill:#ede9df}.muted{fill:#a7a89f}.quiet{fill:#777e7a}.rule{stroke:#353c3a}
  </style>
  <rect width="1280" height="800" fill="#151a19"/><rect width="1280" height="64" fill="#1d2422"/>
  <circle cx="40" cy="32" r="14" fill="#d99b45"/><path d="M34 32h12M40 26v12" stroke="#171b18" stroke-width="2"/><text x="68" y="38" class="ink" font-size="16" font-weight="650">ROOMTONE</text><text x="185" y="38" class="muted" font-size="13">SESSION 04 / BLUE ROOM</text><rect x="1020" y="17" width="110" height="30" rx="15" fill="#29322d"/><circle cx="1038" cy="32" r="4" fill="#70c698"/><text x="1050" y="37" class="muted" font-size="11">All changes saved</text>
  <text x="48" y="120" class="quiet" font-size="11" letter-spacing="1.5">MASTERING / EXPORT</text><text x="48" y="166" class="ink" font-size="28" font-weight="650">Render queue</text><text x="48" y="192" class="muted" font-size="14">Two jobs are processing for Blue Room.</text>
  <rect x="48" y="224" width="735" height="104" rx="11" fill="#28251f" stroke="#57452b"/><circle cx="81" cy="276" r="17" fill="#44331d"/><path d="M81 265v14M81 285v2" stroke="#f2bd63" stroke-width="2.5" stroke-linecap="round"/><text x="112" y="262" fill="#f0d59f" font-size="14" font-weight="650">Peak above delivery target</text><text x="112" y="286" class="muted" font-size="12">Track 08 reached −0.3 dBFS. Review the limiter before publishing.</text><rect x="631" y="254" width="126" height="38" rx="8" fill="#3a3022" stroke="#8b6934"/><text x="651" y="278" fill="#efc976" font-size="12" font-weight="600">Review track</text>
  <rect x="48" y="352" width="735" height="302" rx="12" fill="#1d2422" stroke="#303936"/><text x="76" y="393" class="ink" font-size="15" font-weight="650">Current exports</text><text x="76" y="421" class="muted" font-size="12">Master WAV · 48 kHz / 24 bit</text><text x="744" y="421" class="muted mono" font-size="12" text-anchor="end">72%</text><rect x="76" y="440" width="674" height="8" rx="4" fill="#313936"/><rect x="76" y="440" width="486" height="8" rx="4" fill="#d79a44"/><text x="76" y="474" class="quiet" font-size="11">02:14 remaining</text><line x1="76" y1="495" x2="754" y2="495" class="rule"/><text x="76" y="533" class="ink" font-size="13" font-weight="600">Reference MP3</text><text x="76" y="556" class="muted" font-size="12">320 kbps · Waiting for master</text><rect x="680" y="522" width="70" height="23" rx="11" fill="#26332d"/><text x="694" y="538" fill="#87c8a1" font-size="10">QUEUED</text><rect x="76" y="586" width="118" height="36" rx="8" fill="#272e29" stroke="#434b44"/><text x="98" y="609" class="ink" font-size="12">＋ New export</text>
  <text x="832" y="122" class="quiet" font-size="11" letter-spacing="1.5">RECENT ACTIVITY</text>
  <rect x="824" y="146" width="408" height="102" rx="12" fill="#232b26" stroke="#3e5647" filter="drop-shadow(0 10px 20px #0008)"/><circle cx="853" cy="178" r="12" fill="#2c4937"/><path d="M847 178l4 4 8-9" fill="none" stroke="#90d5a5" stroke-width="2"/><text x="876" y="180" class="ink" font-size="13" font-weight="650">Project saved</text><text x="1205" y="180" class="quiet" font-size="10" text-anchor="end">NOW</text><text x="876" y="203" class="muted" font-size="11">Blue Room session · all tracks</text><text x="876" y="228" fill="#81c997" font-size="11" font-weight="600">Open project →</text>
  <rect x="824" y="264" width="408" height="112" rx="12" fill="#28251f" stroke="#59462c" filter="drop-shadow(0 10px 20px #0008)"/><circle cx="853" cy="296" r="12" fill="#4a351c"/><path d="M853 288v10M853 303v1" stroke="#efbd68" stroke-width="2" stroke-linecap="round"/><text x="876" y="298" class="ink" font-size="13" font-weight="650">Export is taking longer</text><text x="1205" y="298" class="quiet" font-size="10" text-anchor="end">2 MIN</text><text x="876" y="321" class="muted" font-size="11">The network destination is responding slowly.</text><text x="876" y="351" fill="#efbd68" font-size="11" font-weight="600">Retry upload</text><text x="971" y="351" class="muted" font-size="11">·</text><text x="989" y="351" class="muted" font-size="11">Dismiss</text>
  <text x="48" y="754" class="quiet" font-size="11" letter-spacing="1.4">INLINE CARD AND RUNTIME TOASTS</text><text x="1232" y="770" class="quiet" font-size="11" text-anchor="end">AUTHORED TARGET · NOT A CAPTURE</text>
</svg>
