<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Table visual reference</title>
  <desc id="desc">A read-oriented archive table with aligned columns, wrapped descriptive cells, alternate rows, and no interactive grid selection.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.ink{fill:#263445}.muted{fill:#657587}.quiet{fill:#8492a0}.rule{stroke:#dce3e8}
  </style>
  <rect width="1280" height="800" fill="#edf1f3"/><rect width="1280" height="60" fill="#f8fafb"/><rect x="28" y="15" width="30" height="30" rx="8" fill="#527797"/><path d="M34 23h18v14H34zM37 20h12M38 27h10M38 32h7" fill="none" stroke="#f0f7fd" stroke-width="1.4"/><text x="72" y="38" class="ink" font-size="15" font-weight="700">ARCHIVE / COLLECTIONS</text><text x="1113" y="37" class="muted" font-size="12">Read-only inventory</text>
  <text x="52" y="121" class="quiet" font-size="11" letter-spacing="1.4">LIBRARY / SOUND RECORDINGS</text><text x="52" y="166" class="ink" font-size="28" font-weight="650">Field recordings</text><text x="52" y="193" class="muted" font-size="13">Catalog notes with location, format, and collection provenance.</text><rect x="920" y="130" width="306" height="40" rx="9" fill="#fff" stroke="#ced8df"/><circle cx="941" cy="150" r="6" fill="none" stroke="#718395" stroke-width="1.5"/><line x1="946" y1="155" x2="951" y2="160" stroke="#718395" stroke-width="1.5"/><text x="963" y="155" class="quiet" font-size="12">Search collection</text>
  <rect x="52" y="230" width="1174" height="56" rx="9" fill="#dfe7ec"/><text x="78" y="264" class="muted" font-size="11" font-weight="700" letter-spacing=".5">RECORDING</text><text x="470" y="264" class="muted" font-size="11" font-weight="700" letter-spacing=".5">LOCATION / NOTES</text><text x="855" y="264" class="muted" font-size="11" font-weight="700">DURATION</text><text x="1000" y="264" class="muted" font-size="11" font-weight="700">FORMAT</text><text x="1124" y="264" class="muted" font-size="11" font-weight="700">ADDED</text>
  <rect x="52" y="294" width="1174" height="84" rx="8" fill="#fbfcfd"/><rect x="76" y="318" width="31" height="31" rx="8" fill="#e8eef2"/><path d="M88 325v17m-5-5l5 5 5-5" stroke="#527797" stroke-width="1.6" fill="none"/><text x="122" y="328" class="ink" font-size="13" font-weight="650">Low tide at North Pier</text><text x="122" y="350" class="quiet mono" font-size="10">NR-2048 · 02:14</text><text x="470" y="326" class="ink" font-size="12">North coast, 120 m east of marker 4</text><text x="470" y="347" class="muted" font-size="11">Wind through cable stays; gulls in the distance.</text><text x="855" y="340" class="ink mono" font-size="12">02:14</text><text x="1000" y="340" class="ink" font-size="12">WAV · 24 bit</text><text x="1124" y="340" class="muted" font-size="12">Jun 18</text>
  <rect x="52" y="386" width="1174" height="96" rx="8" fill="#f1f5f7"/><rect x="76" y="415" width="31" height="31" rx="8" fill="#e1eaf0"/><path d="M82 438l6-15 6 15" stroke="#527797" stroke-width="1.6" fill="none"/><text x="122" y="423" class="ink" font-size="13" font-weight="650">Harbor bell, fog signal</text><text x="122" y="445" class="quiet mono" font-size="10">NR-2053 · 05:37</text><text x="470" y="415" class="ink" font-size="12">Old ferry basin, west slip</text><text x="470" y="436" class="muted" font-size="11">Two bell strikes every 30 seconds, recorded before sunrise.</text><text x="470" y="456" class="muted" font-size="11">Microphone was sheltered under the dock canopy.</text><text x="855" y="438" class="ink mono" font-size="12">05:37</text><text x="1000" y="438" class="ink" font-size="12">WAV · 24 bit</text><text x="1124" y="438" class="muted" font-size="12">Jun 12</text>
  <rect x="52" y="490" width="1174" height="84" rx="8" fill="#fbfcfd"/><rect x="76" y="514" width="31" height="31" rx="8" fill="#e8eef2"/><path d="M83 530h17M91 522v16" stroke="#527797" stroke-width="1.6"/><text x="122" y="524" class="ink" font-size="13" font-weight="650">Rain on the glass roof</text><text x="122" y="546" class="quiet mono" font-size="10">NR-2019 · 01:48</text><text x="470" y="522" class="ink" font-size="12">Station hall, north entrance</text><text x="470" y="543" class="muted" font-size="11">A steady shower with footsteps crossing the tiled floor.</text><text x="855" y="538" class="ink mono" font-size="12">01:48</text><text x="1000" y="538" class="ink" font-size="12">FLAC · 16 bit</text><text x="1124" y="538" class="muted" font-size="12">May 29</text>
  <rect x="52" y="582" width="1174" height="96" rx="8" fill="#f1f5f7"/><rect x="76" y="612" width="31" height="31" rx="8" fill="#e1eaf0"/><path d="M82 634h19M87 623l5-5 5 5v12" fill="none" stroke="#527797" stroke-width="1.6"/><text x="122" y="620" class="ink" font-size="13" font-weight="650">Dune grass in crosswind</text><text x="122" y="642" class="quiet mono" font-size="10">NR-1982 · 03:06</text><text x="470" y="611" class="ink" font-size="12">Outer beach, south access</text><text x="470" y="632" class="muted" font-size="11">Wind pushes through dry grass; no speech or nearby traffic.</text><text x="470" y="652" class="muted" font-size="11">Notes include a seasonal comparison to the 2024 survey.</text><text x="855" y="635" class="ink mono" font-size="12">03:06</text><text x="1000" y="635" class="ink" font-size="12">WAV · 24 bit</text><text x="1124" y="635" class="muted" font-size="12">May 04</text>
  <line x1="52" y1="702" x2="1226" y2="702" class="rule"/><text x="52" y="738" class="muted" font-size="12">Showing 4 of 184 recordings</text><text x="1226" y="738" class="quiet" font-size="12" text-anchor="end">Column tracks stay aligned as notes wrap.</text><text x="1230" y="778" class="quiet" font-size="11" text-anchor="end">AUTHORED TARGET · NOT A CAPTURE</text>
</svg>
