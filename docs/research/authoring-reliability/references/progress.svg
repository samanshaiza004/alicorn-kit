  <rect x="352" y="570" width="212" height="62" rx="9" fill="#3a3029" stroke="#a16d47"/><circle cx="378" cy="601" r="9" fill="#e3a369"/><path d="M378 596v6l4 2" fill="none" stroke="#2a221d" stroke-width="1.7"/><text x="398" y="598" class="ink" font-size="12" font-weight="600">Normalize</text><text x="398" y="617" fill="#e9b187" font-size="10">72% COMPLETE</text><path d="M574 601h38" stroke="#586971" stroke-width="2"/><path d="M606 595l7 6-7 6" fill="none" stroke="#586971" stroke-width="2"/>
  <rect x="624" y="570" width="212" height="62" rx="9" fill="#222e33"/><circle cx="650" cy="601" r="9" fill="#52666d"/><text x="670" y="598" class="muted" font-size="12" font-weight="600">Package</text><text x="670" y="617" class="quiet" font-size="10">QUEUED</text><path d="M846 601h38" stroke="#586971" stroke-width="2"/><path d="M878 595l7 6-7 6" fill="none" stroke="#586971" stroke-width="2"/>
  <rect x="896" y="570" width="296" height="62" rx="9" fill="#222e33"/><circle cx="922" cy="601" r="9" fill="#52666d"/><text x="942" y="598" class="muted" font-size="12" font-weight="600">Upload</text><text x="942" y="617" class="quiet" font-size="10">WAITING FOR PACKAGE</text></g>
  <text x="80" y="674" class="quiet" font-size="11">DETERMINATE · INDETERMINATE · RANGE PUBLISHED TO ASSISTIVE TECHNOLOGY</text><text x="1232" y="776" class="quiet" font-size="11" text-anchor="end">AUTHORED TARGET · NOT A CAPTURE</text>
</svg>
