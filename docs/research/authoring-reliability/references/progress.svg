<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Progress visual reference</title>
  <desc id="desc">A media delivery console with determinate export progress, a circular upload indicator, and a segmented processing meter.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.ink{fill:#e8edf0}.muted{fill:#a1b0b7}.quiet{fill:#73858c}.rule{stroke:#34434a}
  </style>
  <rect width="1280" height="800" fill="#121a1e"/><rect width="1280" height="60" fill="#1a252b"/><rect x="28" y="14" width="32" height="32" rx="9" fill="#d68148"/><path d="M38 35l5-12 8 7-5 3z" fill="#fff1dc"/><text x="74" y="38" class="ink" font-size="15" font-weight="650">CIRCUIT / DELIVERY</text><text x="1098" y="38" class="muted" font-size="12">Render node 03</text><circle cx="1230" cy="30" r="5" fill="#69c89d"/>
  <text x="48" y="117" class="quiet" font-size="11" letter-spacing="1.4">MEDIA OPERATIONS</text><text x="48" y="162" class="ink" font-size="28" font-weight="650">Delivery jobs</text><text x="48" y="190" class="muted" font-size="14">Prepare review copies for the North Pier campaign.</text><rect x="1044" y="128" width="188" height="42" rx="9" fill="#d68148"/><text x="1070" y="155" fill="#1a1c1b" font-size="13" font-weight="700">＋ New delivery</text>
  <rect x="48" y="226" width="780" height="220" rx="14" fill="#1c282e" stroke="#34454c"/><text x="80" y="267" class="ink" font-size="15" font-weight="650">Campaign master</text><text x="80" y="292" class="muted" font-size="12">4K · ProRes 422 HQ · 00:03:24</text><text x="790" y="292" class="ink mono" font-size="13" text-anchor="end">72%</text><rect x="80" y="315" width="716" height="12" rx="6" fill="#2d3b41"/><rect x="80" y="315" width="516" height="12" rx="6" fill="#e3a369"/><circle cx="598" cy="321" r="8" fill="#ffcf9f" stroke="#6d4c38"/><text x="80" y="360" class="muted" font-size="12">Encoding audio · 48 kHz / 24 bit</text><text x="796" y="360" class="quiet mono" font-size="11" text-anchor="end">00:42 LEFT</text><line x1="80" y1="386" x2="796" y2="386" class="rule"/><text x="80" y="417" class="quiet" font-size="11">DESTINATION</text><text x="170" y="417" class="ink" font-size="12">Review portal / North Pier / v12</text>
  <rect x="856" y="226" width="376" height="220" rx="14" fill="#202b30" stroke="#34454c"/><text x="886" y="267" class="ink" font-size="15" font-weight="650">Cloud upload</text><text x="886" y="291" class="muted" font-size="12">Review copy · 1.8 GB</text><circle cx="1044" cy="365" r="42" fill="none" stroke="#35454b" stroke-width="8"/><path d="M1044 323a42 42 0 1 1-32 15" fill="none" stroke="#71c7ae" stroke-width="8" stroke-linecap="round"/><text x="1044" y="371" class="ink mono" font-size="17" text-anchor="middle">64%</text><text x="1044" y="425" class="quiet" font-size="11" text-anchor="middle">UPLOADING</text>
  <rect x="48" y="472" width="1184" height="234" rx="14" fill="#1a252b" stroke="#33434a"/><text x="80" y="514" class="ink" font-size="15" font-weight="650">Processing stages</text><text x="80" y="540" class="muted" font-size="12">Loudness normalization · −14 LUFS target</text>
