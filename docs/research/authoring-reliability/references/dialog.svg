<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Dialog visual reference</title>
  <desc id="desc">A dark project workspace behind a centered confirmation dialog with wrapping text, a detail row, right-aligned actions, and a visible focus ring on Cancel.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #e7eaf0; }
      .muted { fill: #a4adbb; }
      .quiet { fill: #778292; }
    </style>
  </defs>
  <rect width="1280" height="800" fill="#12151a"/>
  <rect width="1280" height="54" fill="#191d24"/>
  <circle cx="24" cy="27" r="6" fill="#f07972"/><circle cx="44" cy="27" r="6" fill="#e9be5b"/><circle cx="64" cy="27" r="6" fill="#64bd77"/>
  <text x="96" y="33" class="body" font-size="15" font-weight="600">Northstar</text>
  <rect x="0" y="54" width="224" height="746" fill="#171b21"/>
  <text x="26" y="100" class="quiet" font-size="11" font-weight="700" letter-spacing="1.1">SETTINGS</text>
  <text x="48" y="145" class="muted" font-size="14">Profile</text>
  <text x="48" y="187" class="muted" font-size="14">Members</text>
  <rect x="14" y="205" width="196" height="38" rx="7" fill="#252b35"/>
  <text x="48" y="230" class="body" font-size="14">Projects</text>
  <text x="48" y="272" class="muted" font-size="14">Billing</text>
  <text x="48" y="314" class="muted" font-size="14">Security</text>
  <text x="270" y="101" class="body" font-size="25" font-weight="600">Project settings</text>
  <text x="270" y="128" class="muted" font-size="14">Manage access, details, and retention.</text>
  <rect x="270" y="163" width="925" height="94" rx="9" fill="#1a1f27" stroke="#2c333e"/>
  <text x="294" y="199" class="body" font-size="15" font-weight="600">Summer Archive</text>
  <text x="294" y="225" class="muted" font-size="13">Owner: Nora Kim · 14 files · 2 members</text>
  <rect x="1055" y="190" width="116" height="36" rx="7" fill="#33282b" stroke="#644047"/>
  <text x="1076" y="213" fill="#f2c4c6" font-size="13">Delete project</text>
  <rect x="270" y="274" width="925" height="94" rx="9" fill="#1a1f27" stroke="#2c333e"/>
  <text x="294" y="310" class="body" font-size="15" font-weight="600">Workspace access</text>
  <text x="294" y="336" class="muted" font-size="13">Only invited members can view this project.</text>
  <rect x="270" y="385" width="925" height="94" rx="9" fill="#1a1f27" stroke="#2c333e"/>
  <text x="294" y="421" class="body" font-size="15" font-weight="600">File retention</text>
  <text x="294" y="447" class="muted" font-size="13">Files are retained until the project is deleted.</text>
  <rect width="1280" height="800" fill="#080a0d" opacity=".7"/>
  <rect x="382" y="209" width="516" height="382" rx="14" fill="#222730" stroke="#3b424e"/>
  <text x="422" y="260" class="body" font-size="22" font-weight="650">Delete project?</text>
  <text x="422" y="295" class="muted" font-size="14">“Summer Archive” and its files will be removed from</text>
  <text x="422" y="317" class="muted" font-size="14">Northstar for everyone with access. This action cannot</text>
  <text x="422" y="339" class="muted" font-size="14">be undone, and any active downloads will stop.</text>
  <rect x="422" y="365" width="436" height="58" rx="8" fill="#292f39" stroke="#3b424e"/>
  <rect x="438" y="381" width="25" height="25" rx="6" fill="#4a3438"/>
  <path d="M446 387v13M455 387v13M443 384h15M445 384l1-3h9l1 3M445 400h12" fill="none" stroke="#e8b5b5" stroke-width="1.3" stroke-linecap="round"/>
  <text x="478" y="389" class="body" font-size="13" font-weight="600">14 files · 2 members</text>
  <text x="478" y="408" class="muted" font-size="12">Shared access ends immediately.</text>
  <line x1="422" y1="449" x2="858" y2="449" stroke="#3b424e"/>
  <rect x="581" y="481" width="112" height="40" rx="7" fill="#282e38" stroke="#4b5360"/>
  <text x="614" y="506" class="body" font-size="13" font-weight="600">Cancel</text>
  <rect x="577" y="477" width="120" height="48" rx="9" fill="none" stroke="#9bc4ff" stroke-width="2"/>
  <rect x="705" y="481" width="153" height="40" rx="7" fill="#8c4148"/>
  <text x="731" y="506" fill="#fff1f1" font-size="13" font-weight="650">Delete project</text>
  <text x="24" y="778" class="quiet" font-size="11">VISUAL REFERENCE · NOT A CAPTURE</text>
</svg>
