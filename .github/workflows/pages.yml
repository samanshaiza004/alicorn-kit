name: Retired AliKit catalog redirect

# The AliKit catalog is published in the Alicorn documentation site:
# https://carnival-science.github.io/alicorn-website/components/
#
# This workflow keeps the old Pages URL alive as a redirect. The catalog source
# (website/src/content/docs, website/public/captures) still lives in this
# repository and is synced into the Alicorn site; only the standalone deploy is
# retired.

on:
  push:
    branches: [main]
    paths:
      - 'website/redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/redirect
      - id: deployment
        uses: actions/deploy-pages@v4
