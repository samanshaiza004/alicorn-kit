name: AliKit CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website and sync catalog previews
        working-directory: website
        run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read locked dependency revisions
        id: dependency-pins
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath dependencies.lock.json -Raw | ConvertFrom-Json
          "alicorn=$($lock.alicorn.revision)" >> $env:GITHUB_OUTPUT
          "accesskit=$($lock.accesskit_binding.revision)" >> $env:GITHUB_OUTPUT

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-11

      - name: Check out pinned Alicorn
        uses: actions/checkout@v4
        with:
          repository: Carnival-Science/Alicorn
          ref: ${{ steps.dependency-pins.outputs.alicorn }}
          path: alicorn

      - name: Check out pinned AccessKit binding
        uses: actions/checkout@v4
        with:
          repository: samanshaiza004/odin-accesskit
          ref: ${{ steps.dependency-pins.outputs.accesskit }}
          path: alicorn/.deps/odin-accesskit

      - name: Cache AccessKit C SDK
        uses: actions/cache@v4
        with:
          path: alicorn/.deps/accesskit
          key: accesskit-c-0.23.1-windows-x64

      - name: Test model, retained UI, and native consumer
        shell: pwsh
        run: ./tools/test.ps1 -Odin odin

      - name: Validate external package and source-copy consumers
        shell: pwsh
        run: ./tools/validate_external_consumer.ps1 -Odin odin
